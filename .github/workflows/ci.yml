name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-toolchain.toml`; the step below checks it.
          toolchain: "1.100.0"
          components: rustfmt, clippy
      # The pin in `rust-toolchain.toml` and the version the workflows install
      # must agree, or the local build and CI check different compilers again.
      - name: Toolchain pin agrees
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          grep -q "toolchain: \"$pin\"" .github/workflows/ci.yml
          grep -q "toolchain: \"$pin\"" .github/workflows/release.yml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Engines for the differential tests (crates/cagara-sql/tests/engines.rs).
      # Ubuntu's sqlite3 predates the `floor` date modifier (3.46).
      - name: Install SQLite and DuckDB shells
        run: |
          mkdir -p "$RUNNER_TEMP/engines" && cd "$RUNNER_TEMP/engines"
          curl -sSfLo sqlite.zip https://www.sqlite.org/2025/sqlite-tools-linux-x64-3500400.zip
          curl -sSfLo duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.3.2/duckdb_cli-linux-amd64.zip
          unzip -oq sqlite.zip && unzip -oq duckdb.zip && chmod +x sqlite3 duckdb
          echo "$RUNNER_TEMP/engines" >> "$GITHUB_PATH"
      # PostgreSQL for the differential tests, without a server: PGlite is
      # Postgres compiled to WebAssembly, driven by node.
      - name: Install PGlite
        run: npm install --no-save --no-audit --no-fund @electric-sql/pglite
      - run: cargo test --workspace --locked
        env:
          CAGARA_REQUIRE_ENGINES: "1"

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  cross-platform:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      # Execution tests need the SQLite and DuckDB shells, which this job does
      # not install; `cargo test` skips absent engines, but compiling every
      # target is the part that catches path and platform assumptions here.
      - run: cargo check --workspace --all-targets --locked

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npx vsce package --skip-license -o cagara.vsix
