name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-toolchain.toml`; the step below checks it.
          toolchain: "1.100.0"
          components: rustfmt, clippy
      # The pin in `rust-toolchain.toml` and the version the workflows install
      # must agree, or the local build and CI check different compilers again.
      - name: Toolchain pin agrees
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$pin"
          grep -q "toolchain: \"$pin\"" .github/workflows/ci.yml
          grep -q "toolchain: \"$pin\"" .github/workflows/release.yml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # No database engines here on purpose: the differential suite in
      # `crates/cagara-sql/tests/engines.rs` compares rows against SQLite, DuckDB,
      # PostgreSQL, Trino, MariaDB and a Python sqlglot emulation, and running it
      # needs three downloads and two servers. That is too much for every push, so
      # `CAGARA_NO_ENGINES` turns those tests into skips explicitly — not by leaving
      # the engines out, because the runner's own `sqlite3` is older than the 3.46
      # that `floor` needs and would fail instead of skipping.
      #
      # What still runs here is every test that compares the generated SQL text, which
      # is what catches a wrong dialect spelling without a server.
      # `docs/ENGINE-TESTS.md` is how to run the real comparison.
      - run: cargo test --workspace --locked
        env:
          CAGARA_NO_ENGINES: "1"

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  cross-platform:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      # Execution tests need the SQLite and DuckDB shells, which this job does
      # not install; `cargo test` skips absent engines, but compiling every
      # target is the part that catches path and platform assumptions here.
      - run: cargo check --workspace --all-targets --locked

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npx vsce package --skip-license -o cagara.vsix
