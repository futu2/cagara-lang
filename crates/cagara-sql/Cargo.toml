[package]
name = "cagara-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sqlglot-rust.workspace = true
cagara-hir = { path = "../cagara-hir" }

[dev-dependencies]
# `tests/perf.rs` measures CPU time rather than wall time, so its budget means
# the same thing on an idle machine and on a loaded one. `libc` is already in the
# tree transitively; this only names it.
libc = "0.2"

